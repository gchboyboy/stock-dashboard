<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockPulse Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span>StockPulse</span>
        </div>

        <div class="topbar-actions">
          <div class="status-badge">
            <span id="statusIndicator" class="status-dot"></span>
            <span class="status-text">Live Updates</span>
          </div>
          
          <div class="search-wrap">
            <input
              id="searchInput"
              type="text"
              placeholder="Search symbol or company"
              aria-label="Search stock"
            />
            <button id="addWatchlistBtn" class="primary-btn">Add</button>
          </div>

          <button id="themeToggle" class="ghost-btn" aria-label="Toggle dark mode">
            Dark mode
          </button>
        </div>
      </header>

      <main class="dashboard">
        <section class="hero panel">
          <div class="hero-copy">
            <p class="eyebrow">Market overview</p>
            <h1 id="marketHeadline">S&P 500</h1>
          </div>

          <div id="marketSummary" class="summary-grid"></div>
        </section>

        <section class="content-grid">
          <div class="panel chart-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Selected stock</p>
                <h2 id="chartTitle">AAPL</h2>
              </div>

              <div class="price-meta">
                <span id="selectedPrice">$0.00</span>
                <span id="selectedChange" class="change-pill">0.00%</span>
              </div>
            </div>

            <canvas id="priceChart" width="760" height="260"></canvas>
          </div>

          <aside class="panel watchlist-panel">
            <div class="panel-header">
              <h2>Watchlist</h2>
              <button id="refreshWatchlist" class="small-btn">Refresh</button>
            </div>
            <ul id="watchlist" class="watchlist"></ul>
          </aside>

          <div class="panel table-panel">
            <div class="panel-header">
              <h2>Market movers</h2>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>Change</th>
                    <th>Volume</th>
                  </tr>
                </thead>
                <tbody id="stocksTableBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- X Feed Section -->
        <section class="x-feed-section">
          <div class="panel x-feed-panel">
            <div class="panel-header">
              <div>
                <p class="eyebrow">X Feed</p>
                <h2>@<span id="trackedAccount">aleabitoreddit</span></h2>
              </div>
              <div class="x-feed-actions">
                <span id="xLastUpdated" class="x-last-updated"></span>
                <button id="refreshXFeed" class="small-btn">Refresh</button>
              </div>
            </div>
            <div id="xFeedStatus" class="x-feed-status"></div>
            <div id="xFeedList" class="x-feed-list"></div>
          </div>

          <div class="panel x-mentions-panel">
            <div class="panel-header">
              <h2>Stock Mentions</h2>
            </div>
            <div id="xMentionsSummary" class="x-mentions-summary"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
